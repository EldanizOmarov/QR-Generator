<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<title>QR Studio — Pulsuz QR kod generatoru</title>
<meta name="description" content="Pulsuz, qeydiyyatsız QR kod generatoru. Link və ya mətni QR koda çevir, ortasına logo qoy, PNG və ya SVG kimi endir.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%236d5efc'/%3E%3Cg fill='white'%3E%3Crect x='4' y='4' width='6' height='6' rx='1.5'/%3E%3Crect x='14' y='4' width='6' height='6' rx='1.5'/%3E%3Crect x='4' y='14' width='6' height='6' rx='1.5'/%3E%3Crect x='14' y='14' width='3' height='3' rx='.8'/%3E%3Crect x='18' y='18' width='2' height='2' rx='.5'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0b14; --bg2:#10101f; --panel:rgba(26,26,46,.72); --panel-solid:#171728; --line:#282842; --line2:#3a3a5c;
  --text:#f1f2ff; --muted:#9a9abc; --faint:#6a6a8c;
  --a1:#6d5efc; --a2:#b14dff; --a3:#ff5ea8;
  --grad:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));
  --ring:0 0 0 3px rgba(109,94,252,.25);
  --r:18px; --shadow:0 24px 60px -24px rgba(0,0,0,.75);
}
:root[data-theme="light"]{
  --bg:#f3f3fb; --bg2:#ffffff; --panel:rgba(255,255,255,.82); --panel-solid:#ffffff; --line:#e4e4f0; --line2:#d2d2e6;
  --text:#191926; --muted:#5c5c7a; --faint:#9090b0; --shadow:0 24px 60px -30px rgba(50,40,120,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(109,94,252,.22), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(255,94,168,.16), transparent 55%),
    radial-gradient(700px 600px at 50% 120%, rgba(177,77,255,.14), transparent 60%),
    var(--bg);
  background-attachment:fixed;}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
svg{width:20px;height:20px;flex:none}
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 60px}

/* header */
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 26px -8px rgba(109,94,252,.8);flex:none}
.logo svg{width:26px;height:26px;color:#fff}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.sp{flex:1}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;backdrop-filter:blur(10px)}
.seg button{height:34px;min-width:36px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px -8px rgba(109,94,252,.9)}
.icbtn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);backdrop-filter:blur(10px);transition:.15s}
.icbtn:hover{color:var(--text);border-color:var(--line2)}

/* hero tagline */
.hero{text-align:center;margin:0 auto 26px;max-width:680px}
.hero h2{margin:0 0 8px;font-size:clamp(26px,5vw,40px);line-height:1.08;font-weight:850;letter-spacing:-.03em}
.hero h2 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:15px}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--muted);backdrop-filter:blur(10px)}
.badge svg{width:14px;height:14px;color:var(--a2)}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--shadow)}

/* preview */
.preview{position:sticky;top:18px;padding:22px;text-align:center}
@media (max-width:880px){.preview{position:static}}
.qrwrap{position:relative;display:inline-block;padding:16px;border-radius:20px;background:
   conic-gradient(from 0deg,#e9e9f3 0 25%,#f6f6fc 0 50%) 0 0/22px 22px;
   box-shadow:inset 0 0 0 1px var(--line);max-width:100%}
:root[data-theme="light"] .qrwrap{background:conic-gradient(from 0deg,#ececf6 0 25%,#fbfbff 0 50%) 0 0/22px 22px}
#qr{display:block;width:300px;height:300px;max-width:72vw;max-height:72vw;border-radius:10px;image-rendering:-webkit-optimize-contrast}
.pv-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.btn{height:46px;padding:0 18px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:650;font-size:14.5px;border:1px solid var(--line2);background:var(--panel-solid);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--a1);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 12px 26px -12px rgba(109,94,252,.9)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{height:40px;padding:0 13px;font-size:13.5px}
.dlrow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.selbox{height:46px;border-radius:13px;border:1px solid var(--line2);background:var(--panel-solid);padding:0 12px;font-weight:600}

/* controls */
.controls{padding:8px 20px 20px}
.field{padding:18px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.lbl svg{width:15px;height:15px;color:var(--a2)}
textarea{width:100%;min-height:92px;resize:vertical;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);padding:13px 15px;outline:none;font-size:15px;transition:.15s;line-height:1.5}
textarea:focus{border-color:var(--a1);box-shadow:var(--ring)}
.count{text-align:right;font-size:12px;color:var(--faint);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px;color:var(--text);transition:.15s}
.chip svg{width:16px;height:16px;color:var(--a2)}
.chip:hover{border-color:var(--a1)}

.row{display:flex;gap:12px;flex-wrap:wrap}
.col{flex:1;min-width:140px}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.style{border:1.5px solid var(--line);background:var(--bg2);border-radius:14px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s}
.style:hover{border-color:var(--line2)}
.style.on{border-color:var(--a1);background:rgba(109,94,252,.1);box-shadow:var(--ring)}
.style svg{width:34px;height:34px;color:var(--text)}
.style span{font-size:12.5px;font-weight:600;color:var(--muted)}
.style.on span{color:var(--text)}

.color{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.color label{font-size:13.5px;color:var(--muted);flex:1}
.swatch{position:relative;width:34px;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);flex:none;cursor:pointer}
.swatch input{position:absolute;inset:-6px;width:150%;height:150%;border:0;padding:0;cursor:pointer}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pre{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:.12s}
.pre:hover{transform:scale(1.12)}
.pre.on{border-color:var(--text)}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch .n{font-size:14px;font-weight:600}
.switch .d{font-size:12px;color:var(--muted)}
.sw{position:relative;width:46px;height:27px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--grad)}
.sw input:checked+i:before{transform:translateX(19px)}

.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:16px;text-align:center;color:var(--muted);transition:.15s;cursor:pointer;background:var(--bg2)}
.drop:hover,.drop.over{border-color:var(--a1);color:var(--text);background:rgba(109,94,252,.07)}
.drop svg{width:26px;height:26px;color:var(--a2);margin-bottom:6px}
.drop b{color:var(--text)}
.logo-set{display:none;align-items:center;gap:12px;margin-top:12px}
.logo-set.show{display:flex}
.logo-set img{width:46px;height:46px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.slider{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:var(--a1);height:6px}
.rngval{font-size:13px;color:var(--muted);min-width:42px;text-align:right;font-variant-numeric:tabular-nums}

.hint{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.hint svg{width:15px;height:15px;color:var(--a2);flex:none;margin-top:1px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);background:var(--panel-solid);border:1px solid var(--line2);padding:12px 20px;border-radius:13px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.9,.3,1.3);z-index:50;font-weight:600;display:flex;align-items:center;gap:9px}
.toast.show{transform:translate(-50%,0)}
.toast svg{color:var(--a2)}

@media (max-width:560px){
  .wrap{padding:16px 14px 50px}
  header{gap:9px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  .seg button{min-width:30px;padding:0 7px;font-size:12px}
  .icbtn{width:36px;height:36px}
  .hero h2{font-size:27px}
}
footer{text-align:center;color:var(--faint);font-size:12.5px;margin-top:40px;line-height:1.8}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line2)}
footer a:hover{color:var(--text)}

/* steps */
.how{margin-top:46px}
.how h3{text-align:center;font-size:22px;font-weight:800;margin:0 0 22px;letter-spacing:-.02em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{padding:20px;text-align:center}
.step .no{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;margin:0 auto 12px;box-shadow:0 10px 22px -10px rgba(109,94,252,.9)}
.step h4{margin:0 0 6px;font-size:16px}
.step p{margin:0;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="3.2" height="3.2" rx="1"/><rect x="18" y="18" width="3" height="3" rx="1"/><rect x="14" y="18.5" width="2.4" height="2.4" rx=".8"/></svg></div>
    <div class="brand"><h1>QR Studio</h1><p data-t="tag"></p></div>
    <div class="sp"></div>
    <div class="seg" id="lang"><button data-l="az">AZ</button><button data-l="en">EN</button><button data-l="tr">TR</button><button data-l="ru">RU</button></div>
    <button class="icbtn" id="theme" title="Theme" aria-label="Theme"></button>
  </header>

  <div class="hero">
    <h2 id="heroH2"></h2>
    <p data-t="sub"></p>
    <div class="badges">
      <span class="badge" id="b1"></span>
      <span class="badge" id="b2"></span>
      <span class="badge" id="b3"></span>
    </div>
  </div>

  <div class="grid">
    <!-- preview -->
    <section class="card preview">
      <div class="qrwrap"><canvas id="qr" width="300" height="300"></canvas></div>
      <div class="pv-actions">
        <button class="btn primary" id="dlPng" data-t="dlPng"></button>
        <div class="dlrow">
          <select class="selbox" id="size">
            <option value="512">512 px</option>
            <option value="1024" selected>1024 px</option>
            <option value="2048">2048 px</option>
            <option value="4096">4096 px</option>
          </select>
          <button class="btn sm" id="dlSvg">SVG</button>
          <button class="btn sm" id="copy" data-t="copy"></button>
        </div>
      </div>
      <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span data-t="scanHint"></span></div>
    </section>

    <!-- controls -->
    <section class="card controls">
      <div class="field">
        <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span data-t="lContent"></span></div>
        <textarea id="text" placeholder="https://" spellcheck="false"></textarea>
        <div class="count"><span id="cnt">0</span> <span data-t="chars"></span></div>
        <div class="chips" id="chips"></div>
      </div>

      <div class="field">
        <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="19" cy="13" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="M12 2a10 10 0 1 0 0 20 3 3 0 0 0 0-6 2 2 0 0 1 0-4"/></svg><span data-t="lStyle"></span></div>
        <div class="styles" id="styles">
          <button class="style on" data-s="rounded"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2.5" fill="currentColor"/><rect x="14" y="3" width="4" height="4" rx="1.5" fill="currentColor"/><rect x="3" y="14" width="4" height="4" rx="1.5" fill="currentColor"/><rect x="14" y="14" width="4" height="4" rx="1.5" fill="currentColor"/><rect x="19.5" y="9" width="3" height="3" rx="1" fill="currentColor"/><rect x="9" y="19.5" width="3" height="3" rx="1" fill="currentColor"/></svg><span data-t="stRound"></span></button>
          <button class="style" data-s="dots"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="5.5" r="2.5" fill="currentColor"/><circle cx="12" cy="5.5" r="2.5" fill="currentColor"/><circle cx="18.5" cy="5.5" r="2.5" fill="currentColor"/><circle cx="5.5" cy="12" r="2.5" fill="currentColor"/><circle cx="18.5" cy="12" r="2.5" fill="currentColor"/><circle cx="5.5" cy="18.5" r="2.5" fill="currentColor"/><circle cx="12" cy="18.5" r="2.5" fill="currentColor"/></svg><span data-t="stDots"></span></button>
          <button class="style" data-s="square"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" fill="currentColor"/><rect x="11" y="3" width="4" height="4" fill="currentColor"/><rect x="3" y="11" width="4" height="4" fill="currentColor"/><rect x="17" y="3" width="4" height="4" fill="currentColor"/><rect x="11" y="11" width="4" height="4" fill="currentColor"/><rect x="17" y="17" width="4" height="4" fill="currentColor"/></svg><span data-t="stSquare"></span></button>
        </div>
      </div>

      <div class="field">
        <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.6-1.4-.4-.4-.6-.9-.6-1.4 0-1.1.9-2 2-2h2.3A4.9 4.9 0 0 0 22 10.3 10 10 0 0 0 12 2z"/></svg><span data-t="lColor"></span></div>
        <div class="row">
          <div class="col">
            <div class="color"><label data-t="cDots"></label><span class="swatch"><input type="color" id="fg" value="#1a1030"></span></div>
          </div>
          <div class="col">
            <div class="color"><label data-t="cBg"></label><span class="swatch"><input type="color" id="bg" value="#ffffff"></span></div>
          </div>
        </div>
        <div class="presets" id="presets"></div>
        <div class="switch"><div><div class="n" data-t="gradient"></div><div class="d" data-t="gradientD"></div></div><label class="sw"><input type="checkbox" id="gradOn"><i></i></label></div>
        <div class="color" id="fg2box" style="display:none"><label data-t="cDots2"></label><span class="swatch"><input type="color" id="fg2" value="#b14dff"></span></div>
        <div class="switch"><div><div class="n" data-t="transparent"></div><div class="d" data-t="transparentD"></div></div><label class="sw"><input type="checkbox" id="trans"><i></i></label></div>
      </div>

      <div class="field">
        <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L7 20"/></svg><span data-t="lLogo"></span></div>
        <div class="drop" id="drop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></svg>
          <div><b data-t="logoPick"></b> <span data-t="logoOr"></span></div>
        </div>
        <input type="file" id="logoFile" accept="image/*" hidden>
        <div class="logo-set" id="logoSet">
          <img id="logoImg" alt="">
          <div style="flex:1">
            <div class="slider"><span data-t="logoSize" style="font-size:13px;color:var(--muted)"></span><input type="range" id="logoSize" min="12" max="30" value="22"><span class="rngval" id="logoSizeV">22%</span></div>
            <div class="slider" style="margin-top:6px"><label class="switch" style="padding:0;gap:8px;cursor:pointer"><span style="font-size:13px;color:var(--muted)" data-t="logoPad"></span><span class="sw" style="width:40px;height:23px"><input type="checkbox" id="logoPad" checked><i></i></span></label></div>
          </div>
          <button class="btn sm" id="logoRemove" data-t="remove"></button>
        </div>
        <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span data-t="logoHint"></span></div>
      </div>
    </section>
  </div>

  <div class="how">
    <h3 data-t="howTitle"></h3>
    <div class="steps">
      <div class="card step"><div class="no">1</div><h4 data-t="s1t"></h4><p data-t="s1d"></p></div>
      <div class="card step"><div class="no">2</div><h4 data-t="s2t"></h4><p data-t="s2d"></p></div>
      <div class="card step"><div class="no">3</div><h4 data-t="s3t"></h4><p data-t="s3d"></p></div>
    </div>
  </div>

  <footer>
    <div data-t="footer"></div>
    <div style="margin-top:6px"><span data-t="footer2"></span></div>
  </footer>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg><span id="toastMsg"></span></div>

<script src="qrcode.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------------- i18n ---------------- */
const L = {
 az:{tag:'Pulsuz QR kod — logo ilə',h1a:'Linkini',h1b:'QR koda',h1end:'çevir',
  sub:'Link və ya mətni yaz, rəng və logo seç, yüksək keyfiyyətdə endir. Qeydiyyat yoxdur, limit yoxdur.',

}

const COLOR_PRESETS = ['#1a1030','#000000','#6d5efc','#b14dff','#ff5ea8','#0ea5e9','#10b981','#f59e0b','#ef4444','#1f2937'];

/* ---------------- QR drawing ---------------- */
let model=null, lastKey='';
function buildModel(){
  const text = S.text || 'https://';
  const ecc = S.logo ? 'H' : 'M';
  const key = text+'|'+ecc;
  if (key===lastKey && model) return model;
  // auto type number (library grows automatically when typeNumber=0)
  const q = qrcode(0, ecc);
  q.addData(text);
  q.make();
  model = q; lastKey = key;
  return q;
}

function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function isFinder(r,c,n){ // the 3 position-detection 7x7 squares
  return (r<7&&c<7) || (r<7&&c>=n-7) || (r>=n-7&&c<7);
}

// draw into a canvas at given pixel size; returns nothing
function render(canvas, px, forExport){
  const q = buildModel();
  const n = q.getModuleCount();
  const quiet = 4; // modules of quiet zone
  const total = n + quiet*2;
  const cell = px/total;
  const ctx = canvas.getContext('2d');
  canvas.width = px; canvas.height = px;
  ctx.clearRect(0,0,px,px);

  // background
  if (!(S.trans)){
    ctx.fillStyle = S.bg;
    if (forExport){ ctx.fillRect(0,0,px,px); }
    else { roundRect(ctx,0,0,px,px,cell*1.5); ctx.fill(); }
  }

  // foreground paint (solid or gradient)
  let paint = S.fg;
  if (S.grad){
    const g = ctx.createLinearGradient(quiet*cell,quiet*cell,(n+quiet)*cell,(n+quiet)*cell);
    g.addColorStop(0,S.fg); g.addColorStop(1,S.fg2); paint = g;
  }
  ctx.fillStyle = paint;

  const off = quiet*cell;
  const style = S.style;

  // finder patterns: always solid main colour (stay high-contrast even with a gradient)
  const drawFinder = (cr,cc) => {
    ctx.fillStyle = S.fg;
    const x=off+cc*cell, y=off+cr*cell;
    const outer = 7*cell, rad = style==='square'?0:cell*1.8;
    roundRect(ctx,x,y,outer,outer,rad); ctx.fill();
    // punch middle (inner white ring)
    ctx.save(); ctx.globalCompositeOperation = S.trans ? 'destination-out' : 'source-over';
    ctx.fillStyle = S.trans ? '#000' : S.bg;
    roundRect(ctx,x+cell,y+cell,5*cell,5*cell,style==='square'?0:cell*1.2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = S.fg;
    roundRect(ctx,x+2*cell,y+2*cell,3*cell,3*cell,style==='square'?0:cell*0.9); ctx.fill();
  };

  for (let r=0;r<n;r++){
    for (let c=0;c<n;c++){
      if (isFinder(r,c,n)) continue;
      if (!q.isDark(r,c)) continue;
      const x=off+c*cell, y=off+r*cell;
      if (style==='dots'){
        ctx.beginPath(); ctx.arc(x+cell/2,y+cell/2,cell*0.52,0,7); ctx.fill();
      } else if (style==='rounded'){
        roundRect(ctx,x+cell*0.04,y+cell*0.04,cell*0.92,cell*0.92,cell*0.3); ctx.fill();
      } else {
        ctx.fillRect(x,y,cell+0.5,cell+0.5);
      }
    }
  }
  drawFinder(0,0); drawFinder(0,n-7); drawFinder(n-7,0);

  // logo
  if (S.logo){
    const sizeFrac = S.logoSize/100;
    const lw = Math.round(n*cell*sizeFrac);
    const lx = (px-lw)/2, ly=(px-lw)/2;
    if (S.logoPad){
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,.12)'; ctx.shadowBlur=cell*1.5;
      ctx.fillStyle = S.trans ? '#ffffff' : S.bg;
      roundRect(ctx,lx-cell*0.8,ly-cell*0.8,lw+cell*1.6,lw+cell*1.6,cell*2); ctx.fill();
      ctx.restore();
    }
    ctx.save(); roundRect(ctx,lx,ly,lw,lw,cell*1.4); ctx.clip();
    ctx.drawImage(S.logo,lx,ly,lw,lw); ctx.restore();
  }
}

function renderSVG(px){
  const q = buildModel(); const n=q.getModuleCount(); const quiet=4; const total=n+quiet*2;
  const cell = px/total; const off=quiet*cell; const style=S.style;
  let defs='', fill=S.fg;
  if (S.grad){ defs=`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${S.fg}"/><stop offset="1" stop-color="${S.fg2}"/></linearGradient></defs>`; fill='url(#g)'; }
  let body='';
  if (!S.trans) body+=`<rect width="${px}" height="${px}" fill="${S.bg}"/>`;
  const rr=(x,y,w,h,r)=>`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${f(r)}"/>`;
  let shapes='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(isFinder(r,c,n)||!q.isDark(r,c))continue;
    const x=off+c*cell,y=off+r*cell;
    if(style==='dots') shapes+=`<circle cx="${f(x+cell/2)}" cy="${f(y+cell/2)}" r="${f(cell*0.52)}"/>`;
    else if(style==='rounded') shapes+=rr(x+cell*0.04,y+cell*0.04,cell*0.92,cell*0.92,cell*0.3);
    else shapes+=rr(x,y,cell,cell,0);
  }
  const finder=(cr,cc)=>{const x=off+cc*cell,y=off+cr*cell,rad=style==='square'?0:cell*1.8;
    return rr(x,y,7*cell,7*cell,rad)
      +`<rect x="${f(x+cell)}" y="${f(y+cell)}" width="${f(5*cell)}" height="${f(5*cell)}" rx="${f(style==='square'?0:cell*1.2)}" fill="${S.trans?'#ffffff':S.bg}"/>`
      +rr(x+2*cell,y+2*cell,3*cell,3*cell,style==='square'?0:cell*0.9);};
  body+=`<g fill="${fill}">${shapes}</g>`;
  body+=`<g fill="${S.fg}">${finder(0,0)+finder(0,n-7)+finder(n-7,0)}</g>`;
  if(S.logo){
    const sizeFrac=S.logoSize/100, lw=n*cell*sizeFrac, lx=(px-lw)/2, ly=(px-lw)/2;
    if(S.logoPad) body+=`<rect x="${f(lx-cell*0.8)}" y="${f(ly-cell*0.8)}" width="${f(lw+cell*1.6)}" height="${f(lw+cell*1.6)}" rx="${f(cell*2)}" fill="${S.trans?'#ffffff':S.bg}"/>`;
    body+=`<image x="${f(lx)}" y="${f(ly)}" width="${f(lw)}" height="${f(lw)}" href="${S.logoData}" preserveAspectRatio="xMidYMid slice"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="0 0 ${px} ${px}">${defs}${body}</svg>`;
}
const f = v => Math.round(v*100)/100;

/* logo */
const drop=$('#drop'), fileInput=$('#logoFile');
drop.addEventListener('click',()=>fileInput.click());

function loadLogo(file){
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{ S.logo=img; S.logoData=rd.result; $('#logoImg').src=rd.result; $('#logoSet').classList.add('show'); lastKey=''; update(); }; img.src=rd.result; };
  rd.readAsDataURL(file);
}
$('#logoRemove').addEventListener('click',()=>{ S.logo=null; S.logoData=null; $('#logoSet').classList.remove('show'); fileInput.value=''; lastKey=''; update(); });
$('#logoSize').addEventListener('input',e=>{ S.logoSize=+e.target.value; $('#logoSizeV').textContent=e.target.value+'%'; update(); });
$('#logoPad').addEventListener('change',e=>{ S.logoPad=e.target.checked; update(); });

/* downloads */
function filename(ext){ const base=(S.text||'qr').replace(/^https?:\/\//,'').replace(/[^\w.-]+/g,'_').slice(0,32)||'qr'; return 'qr-'+base+'.'+ext; }
function dl(url,name){ const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
$('#dlPng').addEventListener('click',()=>{
  if(!S.text){ toast(t('empty')); $('#text').focus(); return; }
  const px=+$('#size').value; const c=document.createElement('canvas'); render(c,px,true);
  dl(c.toDataURL('image/png'), filename('png'));
});
$('#dlSvg').addEventListener('click',()=>{
  if(!S.text){ toast(t('empty')); $('#text').focus(); return; }
  const svg=renderSVG(1024); const blob=new Blob([svg],{type:'image/svg+xml'}); const url=URL.createObjectURL(blob);
  dl(url,filename('svg')); setTimeout(()=>URL.revokeObjectURL(url),4000);
});
$('#copy').addEventListener('click',async()=>{
  if(!S.text){ toast(t('empty')); $('#text').focus(); return; }
  const c=document.createElement('canvas'); render(c,1024,true);
  try{ const blob=await new Promise(r=>c.toBlob(r,'image/png')); await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]); toast(t('copied')); }
  catch(e){ toast(t('copyErr')); }
});

/* lang + theme */
$('#lang').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; LANG=b.dataset.l; try{localStorage.setItem('qr_lang',LANG)}catch(e){} applyLang(); });
function setTheme(mode){ document.documentElement.setAttribute('data-theme',mode); try{localStorage.setItem('qr_theme',mode)}catch(e){} $('#theme').innerHTML = mode==='light'
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5 3.6 3.6M20.4 20.4 19 19M19 5l1.4-1.4M3.6 20.4 5 19"/></svg>'; }
$('#theme').addEventListener('click',()=>setTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'));

window.QRS={render,renderSVG,buildModel,S};
/* init */
let initTheme='dark'; try{ initTheme=localStorage.getItem('qr_theme')|| (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'); }catch(e){}
setTheme(initTheme);
applyLang(); markPreset(); update();
})();
</script>
